# Chạy thử bằng webcam laptop hướng lên trần có đèn huỳnh quang và quạt trần.
# Camera cầm tay/xê dịch được:
#   - Đèn: "lights_auto" tự dò mọi đèn đang sáng trên toàn khung → không phụ thuộc vị trí camera.
#   - Quạt: "fan_auto" tự tìm vùng cánh quạt đang quay (dao động độ sáng bền vững theo thời gian).
#   - Người: YOLO11n-seg → mặt nạ người chính xác (loại khỏi vùng đo + làm mờ đúng hình người).
# Webcam này chỉ có 640x480@30fps hoặc 1280x720@8fps (đo thực tế) → dùng 640x480, xử lý 20 fps trên GPU,
# cửa sổ gỡ lỗi phóng to 2x + làm nét. Các tham số đếm theo khung đã nhân ~4 so với cấu hình 5 fps.
# Te = 15 s để thử nhanh.
room_id: WEBCAM-TEST
source: "0"
fps: 20
capture_width: 640
capture_height: 480
display_scale: 2.0
device_model: ../models/devices_yolo11n.pt   # YOLO11n (fan, window) huấn luyện trên Open Images
device_conf: 0.45
flip: horizontal              # webcam laptop cho ảnh kiểu gương → lật lại cho thuận chiều
tariff_vnd_per_kwh: 2500

person:
  model: yolo11n-seg.pt
  imgsz: 640
  device: "0"
  conf_occupied: 0.25
  conf_empty: 0.40
  hold_seconds: 2
  window: 20

fsm:
  empty_seconds_to_pending: 2
  te_seconds: 15
  te_no_class_seconds: 15
  off_confirm_seconds: 3

publisher:
  mode: http
  http_url: http://127.0.0.1:8000
  heartbeat_seconds: 2

devices:
  - id: lights
    type: lights_auto
    roi: [0.0, 0.0, 1.0, 1.0]
    power_w: 72
    on_frames: 8
    off_frames: 20                  # 1 s
    # Nhận mọi kiểu đèn (tuýp, tròn âm trần, panel): phần lớn cháy trắng (lõi >= 60%, kể cả quầng sáng),
    # không màu, đứng riêng lẻ, diện tích <= 6% khung.
    # Loại: tường cháy sáng (diện tích lớn), ô cửa sổ (ánh xanh, xếp lưới, box YOLO "window").
    params: {per_light_w: 20, v_min: 240, core_v: 250, core_min: 0.6, min_area: 0.0008, max_area: 0.06,
             fill_min: 0.4, s_mean_max: 12, max_neighbors: 0}
  - id: fans
    type: fan_auto
    roi: [0.0, 0.0, 1.0, 1.0]
    power_w: 60
    on_frames: 8
    off_frames: 32                  # quạt tắt quay chậm dần → chờ ~1,6 s mới kết luận TẮT
    params: {per_fan_w: 60, window: 16, min_frames: 10, tstd_pix: 4.0, heat_alpha: 0.08, heat_on: 0.5,
             min_area: 0.004, max_aspect: 3.0}
