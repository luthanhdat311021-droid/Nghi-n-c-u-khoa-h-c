# HỆ THỐNG QUẢN LÝ PHÒNG HỌC — vận hành liên tục: camera (thị giác máy tính) + ESP32 (nhiệt độ).
#
# Luật cảnh báo: KHÔNG CÓ NGƯỜI liên tục te_seconds (đang đặt 3 giây) mà còn ít nhất một trong:
#   - đèn BẬT  (bộ phân lớp MobileNetV3 trên ảnh camera)
#   - quạt BẬT (bộ phân lớp ảnh chồng thời gian, cần >= 10 fps)
#   - nhiệt độ phòng < 30 °C (ESP32 + DHT11 → coi như máy lạnh đang chạy)
# → phát cảnh báo lên dashboard (+ Telegram nếu cấu hình). Cảnh báo tự đóng khi mọi thiết bị tắt
#   hoặc có người quay lại.
#
# Chạy cả hệ thống bằng một lệnh (tự khởi động lại khi lỗi):
#   python scripts/run_system.py                       → mở http://127.0.0.1:8000
#   python scripts/run_system.py --source http://<IP-điện-thoại>:8080/video --rotate 90   (điện thoại cầm dọc)
#
# Xử lý 30 fps: các tham số đếm theo KHUNG (on_frames, off_frames, person.window) đã nhân 3 so với bản
# 10 fps để giữ nguyên thời gian thực tế. Máy yếu không đạt 30 fps thì hạ fps và chia lại các tham số này.
room_id: C204
source: "0"                     # "0" = webcam laptop; rtsp://... hoặc http://<IP>:8080/video cho camera IP
fps: 30
capture_width: 640
capture_height: 480
display_scale: 2.0
flip: horizontal                # webcam laptop cho ảnh kiểu gương (camera IP: run_system.py tự bỏ lật)
max_side: 640                   # thu nhỏ ảnh camera điện thoại (1080p) cho đủ nhanh
# rotate: 90                    # điện thoại cầm dọc: xoay 90° (hoặc chạy với --rotate 90)
tariff_vnd_per_kwh: 2500

person:
  model: yolo11n-seg.pt
  imgsz: 640
  device: "0"
  half: true                    # FP16 trên GPU NVIDIA → nhanh hơn
  stride: 2                     # YOLO chạy 15 lần/s (cách 1 khung), đèn/quạt vẫn xử lý đủ 30 fps
  conf_occupied: 0.25
  conf_empty: 0.40
  # Sát thời gian thực: đồng hồ "phòng trống" tính từ lúc thấy người lần cuối, hai lớp giữ dưới đây làm lùi mốc đó.
  # te_seconds đã đủ chống báo nhầm khi YOLO lỡ mất người chốc lát → giữ rất ngắn. (Bản chính thức: 3 và 15.)
  hold_seconds: 0.3             # giữ người vừa khuất 0,3 s
  window: 3                     # trung vị 3 lần chạy YOLO (0,2 s khi stride = 2)

fsm:
  empty_seconds_to_pending: 1   # N=0 liên tục 1 s → chuyển "nghi vắng" (tính từ lúc thấy người lần cuối)
  te_seconds: 3                 # trống 3 giây mà còn thiết bị BẬT → CẢNH BÁO (bản chính thức: 120 = 2 phút)
  te_no_class_seconds: 3
  off_confirm_seconds: 5        # thiết bị TẮT ổn định 5 s → đóng cảnh báo

sensor:
  enabled: true
  port: auto                    # tự tìm mạch ESP32 (COM4, COM5, ...)
  stale_seconds: 10

publisher:
  mode: http
  http_url: http://127.0.0.1:8000
  heartbeat_seconds: 0.5        # dashboard cập nhật 2 lần/giây (cảnh báo gửi ngay, không chờ nhịp này)
  frame_fps: 30                 # ảnh xem trực tiếp trên màn hình camera (người đã làm mờ); 0 = tắt
  frame_width: 640

devices:
  - id: lights
    type: light
    roi: [0.0, 0.0, 1.0, 1.0]
    classifier: ../models/light_scene_mnv3.onnx
    power_w: 72
    on_frames: 15               # 0,5 s
    off_frames: 30              # 1 s
    params: {cls_size: [384, 224]}
  # Quạt: dò theo luật "fan_auto" (vùng độ sáng dao động liên tục do cánh quay, loại người + đèn sáng),
  # không phụ thuộc góc camera. Bộ phân lớp fan_scene_mnv3 (huấn luyện trên phòng khác) cho p_on ≈ 0,6
  # ngay cả trên ảnh đứng yên không có quạt → không dùng được với camera này.
  # Tham số theo room_webcam.yaml (20 fps) nhân 1,5 cho 30 fps.
  - id: fans
    type: fan_auto
    roi: [0.0, 0.0, 1.0, 1.0]
    power_w: 60
    on_frames: 30                   # dao động liên tục 1 s mới là quạt quay (người cử động thì ngắt quãng)
    off_frames: 48                  # quạt tắt quay chậm dần → chờ ~1,6 s mới kết luận TẮT
    # reject_bottom_edge: bỏ vùng chạm mép dưới khung (người bị cắt dở đi vào/ra; quạt ở trần/tường)
    params: {per_fan_w: 60, window: 24, min_frames: 15, tstd_pix: 4.0, heat_alpha: 0.055, heat_on: 0.5,
             min_area: 0.004, max_aspect: 3.0, reject_bottom_edge: true}
  - id: ac
    type: ac_temp
    roi: [0.0, 0.0, 1.0, 1.0]   # không dùng (đo bằng cảm biến)
    power_w: 1000               # công suất máy lạnh ước tính để tính điện lãng phí
    on_frames: 60               # nhiệt độ < 30 °C ổn định 2 s (60 khung ở 30 fps)
    off_frames: 60
    params: {on_below: 30.0, off_above: 30.5}
